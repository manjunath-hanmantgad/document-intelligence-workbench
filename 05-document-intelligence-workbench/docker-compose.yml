services:
  api:
    build: .
    command: uvicorn docint_workbench.api:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"
    env_file:
      - .env.example
    volumes:
      - ./storage:/app/storage

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8512
    ports:
      - "8512:8512"
    env_file:
      - .env.example
    depends_on:
      - api
